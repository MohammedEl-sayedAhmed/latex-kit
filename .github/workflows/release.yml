name: Release PDF

# Tag a commit `v*` (e.g. `git tag v1.0 && git push --tags`) to publish a
# GitHub Release with the built PDF attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build with the pinned TeX Live image
        run: scripts/tex latexmk

      # The tag name reaches the shell through env, never pasted into the
      # script text, so an odd tag name can't inject commands.
      - name: Rename PDF with tag
        env:
          TAG: ${{ github.ref_name }}
        run: mv main.pdf "main-$TAG.pdf"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "main-$TAG.pdf" --generate-notes
